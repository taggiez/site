name: Deploy to GitHub Pages

# Auto-deploy taggiez.com on every push to main.
# Replaces the previous manual `npm run deploy` (gh-pages package) flow.

on:
  push:
    branches: [main]
  workflow_dispatch:  # also allow manual trigger from the Actions tab

# Permissions needed by actions/deploy-pages@v4
permissions:
  contents: read
  pages: write
  id-token: write

# Don't let two deploys race; if a new one starts, finish the current one first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
